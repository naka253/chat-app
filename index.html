<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Realtime Chat</title>
 <link rel="icon" href="./ダウンロード.png?v=2" type="image/png">



<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#1e1f22;
  color:white;
}

/* ログイン */
#loginScreen{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}

.card{
  width:100%;
  max-width:400px;

  background:#2b2d31;

  padding:30px;

  border-radius:16px;

  display:flex;
  flex-direction:column;

  gap:15px;
}

.card h1{
  text-align:center;
}

/* 入力 */
input,
textarea{
  width:100%;

  padding:14px;

  border:none;

  border-radius:10px;

  outline:none;

  font-size:16px;
}

/* ボタン */
button{
  padding:14px;

  border:none;

  border-radius:10px;

  cursor:pointer;

  color:white;

  font-size:16px;
}

#joinBtn{
  background:#5865f2;
}

#resetBtn{
  background:#ef4444;
}

#leaveBtn{
  background:#555;
}

/* チャット */
#chatScreen{
  display:none;

  position:fixed;
  inset:0;

  flex-direction:column;

  background:#1e1f22;
}

/* 上 */
.topbar{
  background:#111214;

  padding:12px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;
}

.topbar-right{
  display:flex;
  gap:10px;
}

/* メッセージ */
#messages{
  flex:1;

  overflow-y:auto;

  padding:15px;

  display:flex;

  flex-direction:column;

  gap:10px;
}

.message{
  max-width:80%;

  padding:12px;

  border-radius:12px;

  word-break:break-word;
}

.mine{
  align-self:flex-end;

  background:#5865f2;
}

.other{
  align-self:flex-start;

  background:#313338;
}

.system{
  align-self:center;

  background:#444;

  padding:8px 14px;

  border-radius:999px;

  font-size:14px;
}

.username{
  font-size:12px;

  opacity:0.7;

  margin-bottom:5px;
}

/* 入力欄 */
#messageForm{
  display:flex;

  gap:10px;

  padding:10px;

  background:#111214;
}

#messageInput{
  flex:1;

  resize:none;

  min-height:50px;
  max-height:120px;

  overflow-y:auto;
}

/* オンライン */
#onlineCount{
  font-size:14px;
}

/* スマホ */
@media(max-width:600px){

  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .message{
    max-width:95%;
  }

  button{
    font-size:14px;
  }
}
</style>
</head>

<body>

<!-- ログイン -->
<div id="loginScreen">

  <div class="card">

    <h1>Realtime Chat</h1>

    <input
      type="text"
      id="usernameInput"
      placeholder="名前"
    />

    <input
      type="password"
      id="roomPasswordInput"
      placeholder="入室パスワード"
    />

    <button id="joinBtn">
      入室
    </button>

  </div>

</div>

<!-- チャット -->
<div id="chatScreen">

  <header class="topbar">

    <div>

      <h2>チャット</h2>

      <div id="myName"></div>

      <div id="onlineCount">
        🟢 0人オンライン
      </div>

    </div>

    <div class="topbar-right">

      <button id="resetBtn">
        リセット
      </button>

      <button id="leaveBtn">
        退出
      </button>

    </div>

  </header>

  <main id="messages"></main>

  <form id="messageForm">

    <textarea
      id="messageInput"
      placeholder="メッセージ"
    ></textarea>

    <button type="submit">
      送信
    </button>

  </form>

</div>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

/* =======================
   Supabase設定
======================= */

const SUPABASE_URL =
"https://pckmtoxyyzociqkfgwan.supabase.co";

const SUPABASE_KEY =
"sb_publishable_mP9R6oS3wxN10FTHynaTuA_0hrGCdWh";

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =======================
   パスワード設定
======================= */

/* 入室パスワード */
const ROOM_PASSWORD =
"32384626";

/* 管理者パス */
const ADMIN_PASSWORD =
"0525";

/* =======================
   要素
======================= */

const loginScreen =
document.getElementById("loginScreen");

const chatScreen =
document.getElementById("chatScreen");

const usernameInput =
document.getElementById("usernameInput");

const roomPasswordInput =
document.getElementById("roomPasswordInput");

const joinBtn =
document.getElementById("joinBtn");

const myName =
document.getElementById("myName");

const onlineCount =
document.getElementById("onlineCount");

const messages =
document.getElementById("messages");

const messageForm =
document.getElementById("messageForm");

const messageInput =
document.getElementById("messageInput");

const resetBtn =
document.getElementById("resetBtn");

const leaveBtn =
document.getElementById("leaveBtn");

let username = "";

/* =======================
   入室
======================= */

joinBtn.addEventListener(
  "click",
  async()=>{

    const name =
    usernameInput.value.trim();

    const password =
    roomPasswordInput.value;

    if(!name){

      alert("名前を入力");

      return;
    }

    if(password !== ROOM_PASSWORD){

      alert(
        "パスワードが違います"
      );

      return;
    }

    username = name;

    myName.textContent =
    `名前: ${username}`;

    loginScreen.style.display =
    "none";

    chatScreen.style.display =
    "flex";

    await loadMessages();

    await addSystemMessage(
      `${username} が入室しました`
    );

    await db
    .from("online_users")
    .insert({
      username
    });

    loadOnlineUsers();
  }
);

/* Enter入室 */
roomPasswordInput.addEventListener(
  "keydown",
  (e)=>{

    if(e.key === "Enter"){

      joinBtn.click();
    }
  }
);

/* =======================
   メッセージ取得
======================= */

async function loadMessages(){

  const { data, error } =
  await db
  .from("messages")
  .select("*")
  .order("created_at");

  if(error){

    console.error(error);

    return;
  }

  messages.innerHTML = "";

  data.forEach(msg=>{

    renderMessage(msg);
  });

  scrollBottom();
}

/* =======================
   表示
======================= */

function renderMessage(data){

  const div =
  document.createElement("div");

  if(data.type === "system"){

    div.className = "system";

    div.textContent =
    data.text;

  }else{

    div.className =
    "message";

    div.classList.add(
      data.username === username
      ? "mine"
      : "other"
    );

    div.innerHTML = `
      <div class="username">
        ${escapeHtml(data.username)}
      </div>

      <div>
        ${escapeHtml(data.text)}
      </div>
    `;
  }

  messages.appendChild(div);

  scrollBottom();
}

/* =======================
   送信
======================= */

messageForm.addEventListener(
  "submit",
  async(e)=>{

    e.preventDefault();

    const text =
    messageInput.value.trim();

    if(!text) return;

    messageInput.value = "";

    await db
    .from("messages")
    .insert({
      username,
      text,
      type:"message"
    });
  }
);

/* Enter送信 */
messageInput.addEventListener(
  "keydown",
  (e)=>{

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      messageForm.requestSubmit();
    }
  }
);

/* =======================
   システムメッセージ
======================= */

async function addSystemMessage(text){

  await db
  .from("messages")
  .insert({
    username:"system",
    text,
    type:"system"
  });
}

/* =======================
   リセット
======================= */

resetBtn.addEventListener(
  "click",
  async()=>{

    const password =
    prompt(
      "管理者パスワード"
    );

    if(password === null)
    return;

    if(
      password !==
      ADMIN_PASSWORD
    ){

      alert(
        "パスワード違います"
      );

      return;
    }

    const ok =
    confirm(
      "全チャット削除？"
    );

    if(!ok) return;

    await db
    .from("messages")
    .delete()
    .neq("id",0);

    messages.innerHTML = "";

    await addSystemMessage(
      "チャットがリセットされました"
    );
  }
);

/* =======================
   退出
======================= */

leaveBtn.addEventListener(
  "click",
  async()=>{

    await addSystemMessage(
      `${username} が退出しました`
    );

    await db
    .from("online_users")
    .delete()
    .eq("username",username);

    location.reload();
  }
);

/* =======================
   リアルタイム
======================= */

db
.channel("room1")

.on(
  "postgres_changes",
  {
    event:"INSERT",
    schema:"public",
    table:"messages"
  },

  (payload)=>{

    renderMessage(
      payload.new
    );
  }
)

.subscribe();

/* =======================
   オンライン人数
======================= */

async function loadOnlineUsers(){

  const { data } =
  await db
  .from("online_users")
  .select("*");

  const uniqueUsers =
  [...new Set(
    data.map(
      u=>u.username
    )
  )];

  onlineCount.textContent =
  `🟢 ${uniqueUsers.length}人オンライン`;
}

/* 3秒ごと更新 */
setInterval(
  loadOnlineUsers,
  3000
);

/* =======================
   スクロール
======================= */

function scrollBottom(){

  requestAnimationFrame(()=>{

    messages.scrollTop =
    messages.scrollHeight;
  });
}

/* =======================
   XSS対策
======================= */

function escapeHtml(text){

  const div =
  document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

/* =======================
   タブ閉じ
======================= */

window.addEventListener(
  "beforeunload",
  async()=>{

    if(username){

      await db
      .from("online_users")
      .delete()
      .eq("username",username);

      await addSystemMessage(
        `${username} が退出しました`
      );
    }
  }
);

</script>

</body>
</html>
